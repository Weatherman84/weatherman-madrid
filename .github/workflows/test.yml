name: 0 - Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app.py src tests scripts
      - name: Compile Python
        run: python -m compileall -q app.py src scripts
      - name: Protected forecast baseline hashes
        run: python scripts/verify_engine_baseline.py
      - name: Pytest
        run: pytest -q
      - name: Cloudflare Worker tests
        run: node --test cloudflare-scheduler/test/aemet.test.mjs
