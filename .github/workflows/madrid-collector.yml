name: 3 - Madrid collector

on:
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: Intended UTC slot in ISO-8601 format
        required: false
        type: string
      source:
        description: Dispatch source, for example cloudflare
        required: false
        type: string
      collection_mode:
        description: auto, aviation or fixed
        required: false
        default: auto
        type: choice
        options:
          - auto
          - aviation
          - fixed
  schedule:
    # GitHub is only the hourly safety net. Cloudflare supplies 30-minute aviation
    # slots plus explicitly labelled fixed-checkpoint runs.
    - cron: "7 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: madrid-neon-writer-${{ inputs.scheduled_slot || github.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Record scheduler timestamps
        run: |
          echo "WEATHERMAN_EVENT_CREATED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .created_at)" >> "$GITHUB_ENV"
          echo "WEATHERMAN_RUN_STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect and persist Madrid directly in Neon
        run: python -m weatherman.cli run-collector --airports LEMD --mode "$WEATHERMAN_COLLECTION_MODE"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
          METEOBLUE_DAILY_CALL_LIMIT: "4"
          LIVE_OPEN_METEO_REFRESH_MINUTES: "60"
          WEATHERMAN_EXPECTED_SLOT_AT: ${{ inputs.scheduled_slot }}
          WEATHERMAN_TRIGGER_SOURCE: ${{ inputs.source }}
          WEATHERMAN_COLLECTION_MODE: ${{ inputs.collection_mode || 'auto' }}
