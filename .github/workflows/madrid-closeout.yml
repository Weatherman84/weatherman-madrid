name: 7 - Madrid day closeout

on:
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: Intended UTC closeout slot in ISO-8601 format
        required: false
        type: string
      source:
        description: Dispatch source, for example cloudflare
        required: false
        type: string
  schedule:
    # DST-safe GitHub fallback attempts. Both run; neither can silently skip export.
    - cron: "22 19 * * *"
    - cron: "22 20 * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: madrid-closeout-${{ inputs.scheduled_slot || github.run_id }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Record scheduler timestamps
        run: |
          echo "WEATHERMAN_EVENT_CREATED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .created_at)" >> "$GITHUB_ENV"
          echo "WEATHERMAN_RUN_STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect final METAR, Actual and post-peak snapshot
        run: python -m weatherman.cli run-collector --airports LEMD
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
          METEOBLUE_DAILY_CALL_LIMIT: "4"
          LIVE_OPEN_METEO_REFRESH_MINUTES: "60"
          WEATHERMAN_EXPECTED_SLOT_AT: ${{ inputs.scheduled_slot }}
          WEATHERMAN_TRIGGER_SOURCE: ${{ inputs.source || 'closeout-fallback' }}

  publish:
    needs: closeout
    uses: ./.github/workflows/publish-daily-analysis-export.yml
    secrets: inherit
