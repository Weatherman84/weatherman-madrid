name: 13 - Build opportunity scanner causal feed

on:
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: Intended UTC scanner slot in ISO-8601 format
        required: false
        type: string
      source:
        description: Dispatch source, for example cloudflare
        required: false
        type: string
  schedule:
    # Hourly GitHub fallback. Cloudflare is the 15-minute primary scheduler.
    - cron: "12 6-15 * * *"

permissions:
  contents: read

concurrency:
  group: opportunity-scanner-feed-v1
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip fresh GitHub fallback duplicates
        id: gate
        shell: bash
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          base = os.environ.get("PUBLIC_BASE_URL", "").rstrip("/")
          should_run = True
          if base:
              try:
                  request = Request(
                      f"{base}/opportunity-scanner-feed.json",
                      headers={"Cache-Control": "no-cache", "User-Agent": "Opportunity-Scanner-Fallback/1.0"},
                  )
                  with urlopen(request, timeout=10) as response:
                      payload = json.load(response)
                  safe = (
                      payload.get("schema_version") == "opportunity_scanner_feed_v1"
                      and payload.get("classification")
                      == "CROSS-AIRPORT CAUSAL RESEARCH-ONLY SHADOW FEED"
                      and payload.get("research_only") is True
                      and payload.get("automatic_promotion") is False
                      and payload.get("automatic_execution") is False
                      and payload.get("writes_production_database") is False
                  )
                  if not safe:
                      raise ValueError("unsafe scanner feed")
                  generated = datetime.fromisoformat(str(payload["generated_at"]).replace("Z", "+00:00"))
                  age_minutes = (datetime.now(timezone.utc) - generated.astimezone(timezone.utc)).total_seconds() / 60
                  should_run = age_minutes > 12
                  print(f"feed_age_minutes={max(0.0, age_minutes):.1f}")
              except Exception as exc:
                  print(f"fallback_check={type(exc).__name__}")
          print(f"should_run={'true' if should_run else 'false'}")
          PY
      - uses: actions/checkout@v6
        if: steps.gate.outputs.should_run == 'true'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.should_run == 'true'
        run: pip install -e .
      - name: Require separate scanner Worker
        if: steps.gate.outputs.should_run == 'true'
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
          PUBLISH_TOKEN: ${{ secrets.OPPORTUNITY_SCANNER_PUBLISH_TOKEN }}
        run: |
          test -n "$PUBLIC_BASE_URL"
          test -n "$PUBLISH_TOKEN"
      - name: Build causal six-airport feed
        if: steps.gate.outputs.should_run == 'true'
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
        run: |
          python scripts/build_opportunity_scanner_feed.py \
            --existing-url "${PUBLIC_BASE_URL%/}/opportunity-scanner-feed.json" \
            --output opportunity-scanner-feed.json
      - name: Validate and publish separate feed
        if: steps.gate.outputs.should_run == 'true'
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
          PUBLISH_TOKEN: ${{ secrets.OPPORTUNITY_SCANNER_PUBLISH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from weatherman.opportunity_feed import validate_live_feed
          payload=json.load(open("opportunity-scanner-feed.json", encoding="utf-8"))
          validate_live_feed(payload)
          assert len(payload["forecasts"]) == 6
          PY
          curl --fail --silent --show-error -X POST "${PUBLIC_BASE_URL%/}/internal/publish-feed" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" -H "Content-Type: application/json" \
            --data-binary @opportunity-scanner-feed.json --output feed-publication.json
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.should_run == 'true'
        with:
          name: opportunity-scanner-feed-${{ github.run_id }}
          path: |
            opportunity-scanner-feed.json
            feed-publication.json
          retention-days: 14
