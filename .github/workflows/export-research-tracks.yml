name: 9 - Export Madrid research tracks

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Final Madrid days (1-90; default 30)"
        required: true
        default: "30"
      end_date:
        description: "Optional final date (YYYY-MM-DD)"
        required: false
        default: ""
      dry_run:
        description: "Estimate limits without querying Neon"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Export compact checkpoint research evidence
        shell: bash
        run: |
          args=(--days "$EXPORT_DAYS" --output regime-replay-export.json)
          if [[ -n "$EXPORT_END_DATE" ]]; then
            args+=(--end-date "$EXPORT_END_DATE")
          fi
          if [[ "$EXPORT_DRY_RUN" = "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/export_research_tracks.py "${args[@]}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPORT_DAYS: ${{ inputs.days }}
          EXPORT_END_DATE: ${{ inputs.end_date }}
          EXPORT_DRY_RUN: ${{ inputs.dry_run }}
      - name: Upload compact research export
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: madrid-research-tracks-v0.1
          path: regime-replay-export.json
          if-no-files-found: error
          retention-days: 14
