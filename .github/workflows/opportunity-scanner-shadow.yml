name: 14 - Cross-airport Opportunity Scanner shadow

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["13 - Build opportunity scanner causal feed"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: opportunity-scanner-shadow-v1
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Require separate scanner endpoints
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
          ACTIVATION_DATE: ${{ vars.OPPORTUNITY_SCANNER_ACTIVATION_DATE }}
        run: |
          test -n "$PUBLIC_BASE_URL"
          test -n "$ACTIVATION_DATE"
      - name: Fetch compact causal feed
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
        run: curl --fail --silent --show-error "${PUBLIC_BASE_URL%/}/opportunity-scanner-feed.json" --output scanner-feed.json
      - name: Build append-only shadow journal
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
          ACTIVATION_DATE: ${{ vars.OPPORTUNITY_SCANNER_ACTIVATION_DATE }}
        run: |
          python scripts/run_opportunity_scanner.py \
            --input scanner-feed.json \
            --database "${RUNNER_TEMP}/opportunity-scanner.db" \
            --existing-url "${PUBLIC_BASE_URL%/}/opportunity-scanner-journal.json" \
            --existing-snapshot-output scanner-journal-before.json \
            --activation-date "$ACTIVATION_DATE" \
            --output opportunity-scanner-journal.json
      - name: Select new deduplicated push alerts
        id: alerts
        run: |
          python scripts/build_opportunity_notifications.py \
            --previous scanner-journal-before.json \
            --current opportunity-scanner-journal.json \
            --output opportunity-notifications.json
          echo "count=$(jq 'length' opportunity-notifications.json)" >> "$GITHUB_OUTPUT"
      - name: Send GitHub push alerts
        if: steps.alerts.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_ASSIGNEE: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          title="Opportunity Scanner Push Alerts"
          gh label create opportunity-alert \
            --repo "$GH_REPO" --color "1D76DB" \
            --description "Deduplicated Opportunity Scanner push messages" --force
          issue_number="$(gh issue list --repo "$GH_REPO" --state all --limit 1000 \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ -z "$issue_number" ]]; then
            issue_url="$(gh issue create --repo "$GH_REPO" --title "$title" \
              --label opportunity-alert --assignee "$ALERT_ASSIGNEE" \
              --body "Automatische, deduplizierte Research-only-Meldungen für LTFM-Regelsignale und EPWA-Signale mit positivem konservativem Edge. Keine automatische Ausführung.")"
            issue_number="${issue_url##*/}"
          else
            gh issue edit "$issue_number" --repo "$GH_REPO" --add-assignee "$ALERT_ASSIGNEE"
            if [[ "$(gh issue view "$issue_number" --repo "$GH_REPO" --json state --jq .state)" == "CLOSED" ]]; then
              gh issue reopen "$issue_number" --repo "$GH_REPO"
            fi
          fi
          while IFS= read -r encoded; do
            row="$(printf '%s' "$encoded" | base64 --decode)"
            opportunity_id="$(jq -r '.opportunity_id' <<<"$row")"
            marker="<!-- opportunity-alert:${opportunity_id} -->"
            if gh api --paginate "repos/${GH_REPO}/issues/${issue_number}/comments" \
              --jq '.[].body' | grep -Fq -- "$marker"; then
              echo "Already notified: $opportunity_id"
              continue
            fi
            body="$(jq -r '.github_comment' <<<"$row")"
            gh api "repos/${GH_REPO}/issues/${issue_number}/comments" \
              --method POST --raw-field body="$body" >/dev/null
            echo "Notified: $opportunity_id"
          done < <(jq -r '.[] | @base64' opportunity-notifications.json)
      - name: Validate and publish separate journal
        env:
          PUBLIC_BASE_URL: ${{ vars.OPPORTUNITY_SCANNER_PUBLIC_BASE_URL }}
          PUBLISH_TOKEN: ${{ secrets.OPPORTUNITY_SCANNER_PUBLISH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          payload=json.load(open("opportunity-scanner-journal.json", encoding="utf-8"))
          assert payload["research_only"] is True
          assert payload["automatic_promotion"] is False
          assert payload["automatic_execution"] is False
          assert payload["writes_production_database"] is False
          assert payload["active_rule_count"] == 24
          PY
          curl --fail --silent --show-error -X POST "${PUBLIC_BASE_URL%/}/internal/publish" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" -H "Content-Type: application/json" \
            --data-binary @opportunity-scanner-journal.json --output scanner-publication.json
      - uses: actions/upload-artifact@v4
        with:
          name: opportunity-scanner-shadow-${{ github.run_id }}
          path: |
            opportunity-scanner-journal.json
            opportunity-notifications.json
            scanner-publication.json
          retention-days: 14
