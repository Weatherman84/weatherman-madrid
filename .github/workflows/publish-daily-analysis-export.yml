name: 6 - Publish Madrid daily-analysis export

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: madrid-analysis-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      generated_at: ${{ steps.export_meta.outputs.generated_at }}
      target_date: ${{ steps.export_meta.outputs.target_date }}
      size_bytes: ${{ steps.export_meta.outputs.size_bytes }}
      sha256: ${{ steps.export_meta.outputs.sha256 }}
      mirror_configured: ${{ steps.mirror.outputs.configured }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Export seven Madrid days from Neon read-only
        run: >-
          python scripts/export_madrid_daily_analysis.py
          --days 7
          --output _site/daily-analysis-latest.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AEMET_PUBLIC_BASE_URL: ${{ vars.AEMET_PUBLIC_BASE_URL }}
      - name: Fail closed if the export is unsafe or stale
        run: >-
          python scripts/validate_madrid_daily_analysis_export.py
          _site/daily-analysis-latest.json
          --max-age-minutes 10
      - name: Prepare exact-byte latest and dated publication files
        id: export_meta
        run: >-
          python scripts/prepare_daily_analysis_publication.py
          _site/daily-analysis-latest.json
          --site-root _site
          --github-output "$GITHUB_OUTPUT"
      - name: Mirror the same validated bytes to Cloudflare KV
        id: mirror
        shell: bash
        env:
          MIRROR_BASE_URL: ${{ vars.AEMET_PUBLIC_BASE_URL }}
          PUBLISH_TOKEN: ${{ secrets.DAILY_ANALYSIS_PUBLISH_TOKEN }}
          EXPECTED_SHA256: ${{ steps.export_meta.outputs.sha256 }}
        run: |
          if [[ -z "$MIRROR_BASE_URL" || -z "$PUBLISH_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo '{"status":"not_configured","production_database_queries":0}'
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "${MIRROR_BASE_URL%/}/internal/publish-daily-analysis" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @_site/daily-analysis-latest.json \
            --output /tmp/mirror-publication.json
          python -c 'import json, os; p=json.load(open("/tmp/mirror-publication.json")); assert p["sha256"] == os.environ["EXPECTED_SHA256"]; print(p)'
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish stable read-only URL
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify both latest aliases and dated files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          MIRROR_URL: ${{ needs.build.outputs.mirror_configured == 'true' && vars.AEMET_PUBLIC_BASE_URL || '' }}
          EXPECTED_GENERATED_AT: ${{ needs.build.outputs.generated_at }}
          EXPECTED_TARGET_DATE: ${{ needs.build.outputs.target_date }}
          EXPECTED_SIZE_BYTES: ${{ needs.build.outputs.size_bytes }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: >-
          python scripts/verify_daily_analysis_publication.py
          --primary-base "$PAGE_URL"
          --mirror-base "$MIRROR_URL"
          --generated-at "$EXPECTED_GENERATED_AT"
          --target-date "$EXPECTED_TARGET_DATE"
          --size-bytes "$EXPECTED_SIZE_BYTES"
          --sha256 "$EXPECTED_SHA256"
          --output daily-analysis-publication-report.json
      - name: Upload publication provenance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: madrid-daily-analysis-publication
          path: daily-analysis-publication-report.json
          if-no-files-found: warn
          retention-days: 14
