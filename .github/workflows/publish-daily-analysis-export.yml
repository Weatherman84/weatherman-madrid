name: 6 - Publish Madrid daily-analysis export

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: madrid-analysis-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      generated_at: ${{ steps.export_meta.outputs.generated_at }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Export seven Madrid days from Neon read-only
        run: >-
          python scripts/export_madrid_daily_analysis.py
          --days 7
          --output _site/daily-analysis-latest.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Fail closed if the export is unsafe or stale
        run: >-
          python scripts/validate_madrid_daily_analysis_export.py
          _site/daily-analysis-latest.json
          --max-age-minutes 10
      - name: Record expected publication timestamp
        id: export_meta
        run: |
          echo "generated_at=$(python -c 'import json; print(json.load(open("_site/daily-analysis-latest.json"))["generated_at"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish stable read-only URL
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the deployed export is current
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED_GENERATED_AT: ${{ needs.build.outputs.generated_at }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              "${PAGE_URL}daily-analysis-latest.json?run=${RUN_ID}" \
              --output /tmp/published-export.json; then
              generated_at="$(python -c 'import json; print(json.load(open("/tmp/published-export.json"))["generated_at"])')"
              if [ "$generated_at" = "$EXPECTED_GENERATED_AT" ]; then
                echo "Published generated_at=${generated_at}"
                exit 0
              fi
              echo "Pages still serves generated_at=${generated_at}; waiting for ${EXPECTED_GENERATED_AT}"
            fi
            sleep 10
          done
          echo "Published export could not be verified" >&2
          exit 1
